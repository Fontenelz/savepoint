name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR/branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # O Prisma só gera o client; nenhum passo conecta ao banco.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      # Versão do pnpm vem do campo packageManager do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Auditoria de dependências (só high/critical)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
